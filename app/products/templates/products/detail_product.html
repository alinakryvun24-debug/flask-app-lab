{% extends 'base.html' %}

{% block title %}{{ product.name }}{% endblock %}

{% block content %}
<div class="card shadow-sm p-4 mt-3">
    <h2>{{ product.name }}</h2>
    <h4 class="text-success">${{ product.price }}</h4>
    <p class="mt-3">{{ product.content }}</p>
    <a href="{{ url_for('products.list_products') }}" class="btn btn-secondary text-white mt-2">← Назад до каталогу</a>
</div>
{% endblock %}
