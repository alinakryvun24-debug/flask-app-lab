{% extends 'base.html' %}

{% block title %}Список товарів{% endblock %}

{% block content %}
<h1 class="mb-4">Каталог товарів</h1>
<div class="row">
    {% for product in products %}
    <div class="col-md-4 mb-3">
        <div class="card h-100 shadow-sm">
            <div class="card-body">
                <h5 class="card-title">{{ product.name }}</h5>
                <p class="card-text text-muted">${{ product.price }}</p>
                <a href="{{ url_for('products.product_detail', product_id=product.id) }}" class="btn btn-primary">Детальніше</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
