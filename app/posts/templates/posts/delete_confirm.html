{% extends 'base.html' %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <h1>Видалення поста</h1>

        <p>
            Ви справді хочете видалити пост
            <strong>«{{ post.title }}»</strong>?
        </p>

        <form method="POST">
            {{ form.hidden_tag() }}

            {% for error in form.csrf_token.errors %}
                <div class="alert alert-danger">{{ error }}</div>
            {% endfor %}

            {{ form.submit(class="btn btn-danger") }}

            <a href="{{ url_for('posts.detail_post', id=post.id) }}"
               class="btn btn-secondary">
                Скасувати
            </a>
        </form>
    </div>
</div>
{% endblock %}
